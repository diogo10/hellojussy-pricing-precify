name: Automerge

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
  check_run:
    types:
      - completed
  status:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    name: Automerge
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible pull requests
        uses: lirantal/automerge@v1
