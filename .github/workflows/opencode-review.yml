name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Add these two steps to configure Git
      - name: Configure Git 
        run: |
          git config --global user.email "diogjp10@gmail.com"
          git config --global user.name "Diogo Action"   
      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues. Grade it using A to B. Where A is the all good
            - Look for potential bugs
            - Suggest improvements 
            - Push a new commit into the pull request with the improvements. 
